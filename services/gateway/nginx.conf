worker_processes auto;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict limits 10m;
    lua_shared_dict auth_limits 10m;

    server {
        listen 8088;

        location = /health {
            default_type application/json;
            content_by_lua_block {
                ngx.say('{"status":"ok","gateway":"openresty-luajit"}')
            }
        }

        # Login has a stricter per-IP limit to slow password guessing.
        location = /api/auth/login {
            access_by_lua_file /etc/nginx/lua/auth_rate_limit.lua;
            proxy_pass http://api:8080;
        }

        # Public restaurant applications use a stricter limit to reduce abuse.
        location = /api/restaurants/apply {
            access_by_lua_file /etc/nginx/lua/restaurant_rate_limit.lua;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api:8080;
        }

        location /api/ {
            access_by_lua_file /etc/nginx/lua/rate_limit.lua;
            proxy_pass http://api:8080;
        }
    }
}
